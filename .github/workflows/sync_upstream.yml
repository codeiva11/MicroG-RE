name: "Sync Upstream"

on:
  schedule:
    # Runs twice every day (at 00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: "Sync from Upstream"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: "Checkout fork repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: "Configure Git identity"
        run: |
          git config --global user.name "codeiva11"
          git config --global user.email "codeiva11@users.noreply.github.com"

      - name: "Add and fetch upstream"
        run: |
          git remote add upstream https://github.com/MorpheApp/MicroG-RE.git || true
          git fetch upstream dev --tags
          git fetch upstream main || true

      - name: "Merge upstream updates while preserving custom fixes"
        id: merge_upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_COMMIT=$(git rev-parse HEAD)
          UPSTREAM_TARGET="upstream/dev"
          
          echo "Current HEAD: $CURRENT_COMMIT"
          echo "Merging $UPSTREAM_TARGET into main..."
          
          # Attempt standard merge
          if git merge "$UPSTREAM_TARGET" -m "chore: sync upstream changes"; then
            echo "Clean merge completed."
          else
            echo "Merge conflicts encountered. Resolving while preserving our anti-adware fixes..."
            
            # Ensure SYSTEM_ALERT_WINDOW remains removed if upstream attempts to restore it
            sed -i '/SYSTEM_ALERT_WINDOW/d' play-services-core/src/main/AndroidManifest.xml || true
            sed -i '/SYSTEM_ALERT_WINDOW/d' firebase-auth/core/src/main/AndroidManifest.xml || true
            
            # Ensure legacy ReCaptchaOverlayService remains removed
            rm -f firebase-auth/core/src/main/kotlin/org/microg/gms/firebase/auth/ReCaptchaOverlayService.kt || true
            git rm -f firebase-auth/core/src/main/kotlin/org/microg/gms/firebase/auth/ReCaptchaOverlayService.kt || true
            
            # Resolve a known conflict by keeping the fork side. NOTE:
            # `git checkout --ours` only rewrites the worktree — it leaves
            # the index stages unmerged, so the path must be `git add`ed
            # too, or `git ls-files --unmerged` still lists it below.
            resolve_ours() { git checkout --ours "$1" && git add "$1" || true; }

            # Remove overlay check from SelfCheckFragment if restored
            resolve_ours play-services-core/src/main/java/org/microg/gms/ui/SelfCheckFragment.java
            resolve_ours firebase-auth/core/src/main/kotlin/org/microg/gms/firebase/auth/FirebaseAuthService.kt

            # The fork deliberately deleted the Games overlay-popup code
            # (AccountPromptManager + its GamesService call site). Upstream
            # still carries it (dead code behind `if (false)`), so every sync
            # conflicts here: keep the fork side.
            resolve_ours play-services-core/src/main/kotlin/org/microg/gms/games/GamesService.kt
            resolve_ours play-services-core/src/main/kotlin/org/microg/gms/games/utils/AccountPromptManager.kt

            # The fork's release workflow is customised for the fork (own
            # keystore setup, push triggers, fork signing outputs). Upstream
            # reworked release.yml (version-bump + gh release create); taking
            # their version would drop the fork signing flow, so keep ours.
            resolve_ours .github/workflows/release.yml

            # Never commit conflict markers: if anything is still conflicted,
            # abort the merge and fail loudly instead of pushing broken files.
            if git ls-files --unmerged | grep -q .; then
              echo "Unresolved conflicts remain:"
              git ls-files --unmerged
              # The sed edits above can leave the index not uptodate, which
              # makes `git merge --abort` fail; fall back to a hard reset.
              git merge --abort || git reset --hard HEAD
              exit 1
            fi

            git add -A
            git commit -m "chore: sync upstream changes while preserving overlay & adware fixes" || true
          fi

          # Keep the in-app updater pointed at our own fork releases. Our builds are
          # signed with the fork key (tytydraco); an upstream (MorpheApp) signed APK
          # would fail our own in-app signature check, so the updater must never
          # silently revert to the upstream URL during a sync. This guard runs after
          # every merge (clean or conflict-resolved), before the push decision: if the
          # URL was restored, put it back and fold the fix into the sync commit.
          # Deliberately NOT merge=ours on AppUpdater.kt: upstream updater
          # improvements must keep flowing in; only the release-source URL is ours.
          if grep -q 'MorpheApp/MicroG-RE' play-services-core/src/main/kotlin/org/microg/gms/ui/updater/AppUpdater.kt; then
            echo "Upstream updater URL detected after merge, restoring fork URL..."
            sed -i 's|MorpheApp/MicroG-RE|codeiva11/MicroG-RE|g' play-services-core/src/main/kotlin/org/microg/gms/ui/updater/AppUpdater.kt
            git add play-services-core/src/main/kotlin/org/microg/gms/ui/updater/AppUpdater.kt
            git commit -m "chore: keep in-app updater pointed at fork releases" || true
          fi

          NEW_COMMIT=$(git rev-parse HEAD)
          if [ "$CURRENT_COMMIT" != "$NEW_COMMIT" ]; then
            echo "New changes merged. Pushing to origin main..."
            git push origin main
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new updates found from upstream."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Trigger Release Workflow on new update"
        if: steps.merge_upstream.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering automated release build..."
          gh workflow run release.yml --ref main || true
